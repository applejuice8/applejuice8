name: GitHub-Profile-3D-Contrib

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    name: generate-github-profile-3d-contrib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      # The action always writes to ./profile-3d-contrib; keep generated images under assets/.
      - name: Move output into assets/
        run: |
          mkdir -p assets
          rm -rf assets/profile-3d
          mv profile-3d-contrib assets/profile-3d
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/profile-3d
          if git commit -m "Update 3D contribution graph"; then
            git pull --rebase origin main
            git push
          fi
