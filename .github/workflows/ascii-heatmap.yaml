name: ASCII Heatmap

on:
  workflow_dispatch:
  schedule:
    - cron: "45 0 * * *" # daily, after the other profile workflows

permissions:
  contents: write

jobs:
  heatmap:
    name: generate-contribution-heatmap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate heatmap
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ascii/heatmap.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ascii/contrib-heatmap.svg
          if git commit -m "chore: update contribution heatmap"; then
            git pull --rebase origin main
            git push
          fi
